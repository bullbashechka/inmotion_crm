name: Verify

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inmotion_crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d inmotion_crm_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run architecture:check
      - run: bun audit
      - name: Mark the isolated CI database as disposable
        env:
          PGPASSWORD: postgres
        run: >-
          psql postgresql://postgres@localhost:5432/postgres
          --set=ON_ERROR_STOP=1
          --command="COMMENT ON DATABASE inmotion_crm_test IS 'inmotion-task002-disposable'"
      - name: Database security integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inmotion_crm_test
          TEST_DATABASE_DISPOSABLE_CLUSTER: "1"
        run: bun run --cwd backend test:db
